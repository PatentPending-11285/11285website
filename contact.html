<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - Patent Pending</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="static/logo.png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Mulish', sans-serif;
            color: white;
            overflow-x: hidden;
            margin: 0;
        }

        /* =========================
           Background Slideshow
        ========================= */

        .bg-cycle {
            --cycle-duration: 36s;
        }

        .bg {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            opacity: 0;
            animation: fadeCycle var(--cycle-duration) infinite;
            will-change: opacity;
        }

        .bg1 {
            background-image: url("static/team1.png");
            animation-delay: 0s;
        }

        .bg2 {
            background-image: url("static/team2.jpg");
            animation-delay: 9s;
        }

        .bg3 {
            background-image: url("static/team3.png");
            animation-delay: 18s;
        }

        .bg4 {
            background-image: url("static/team4.png");
            animation-delay: 27s;
        }

        @keyframes fadeCycle {
            0% {
                opacity: 0;
            }

            5.56% {
                opacity: 1;
            }

            25% {
                opacity: 1;
            }

            30.56% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .bg {
                animation: none;
            }

            .bg1 {
                opacity: 1;
            }

            .bg2,
            .bg3,
            .bg4 {
                opacity: 0;
            }
        }

        /* =========================
           General Buttons
        ========================= */

        .btn {
            font-family: 'Roboto Condensed', sans-serif;
            letter-spacing: 0.5px;
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                filter 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:focus-visible {
            outline: 3px solid #FFC627;
            outline-offset: 2px;
        }

        /* =========================
           Navbar
        ========================= */

        .asu-red {
            background-color: #8C1D40;
        }

        .btn-nav-outline {
            background-color: transparent;
            border: 1.5px solid #ffffff;
            color: #ffffff;
            padding: 0.35rem 0.85rem;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .btn-nav-outline:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .btn-home {
            background-color: #FFC627;
            border: 1.5px solid #ffffff;
            color: #ffffff;
            padding: 0.35rem 0.85rem;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .btn-home:hover {
            background-color: #e6b322;
            border-color: #ffffff;
            color: #ffffff;
        }

        .nav-links {
            flex-wrap: wrap;
            row-gap: 0.4rem;
        }

        /* =========================
           Dark Overlay
        ========================= */

        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
            min-height: 100vh;
        }

        /* =========================
           Page Title
        ========================= */

        .outlined-title {
            font-family: 'Mulish', sans-serif;
            color: #ffffff;
            text-shadow: none;
        }

        /* =========================
           Contact Card
        ========================= */

        .contact-card {
            max-width: 1000px;
            margin: 0 auto;
            padding: 35px;
            background: rgba(20, 20, 20, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .contact-title {
            font-family: 'Mulish', sans-serif;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .contact-description {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 25px;
        }

        /* =========================
           Google Form
        ========================= */

        .form-container {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
            background: white;
        }

        .google-form {
            display: block;
            width: 100%;
            min-height: 850px;
            border: none;
        }

        /* =========================
           Email Button
        ========================= */

        .email-button {
            background-color: #8C1D40;
            border: 2px solid white;
            color: white;
            padding: 12px 28px;
            font-size: 1.1rem;
            border-radius: 8px;
        }

        .email-button:hover {
            background-color: #a5264f;
            color: white;
        }

        /* =========================
           Footer
        ========================= */

        footer {
            margin-top: 60px;
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 768px) {

            .contact-card {
                padding: 20px;
                border-radius: 12px;
            }

            .google-form {
                min-height: 900px;
            }

            .display-3 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 576px) {

            .nav-links {
                justify-content: center;
                margin-top: 10px;
            }

            .contact-card {
                padding: 15px;
            }

            .google-form {
                min-height: 950px;
            }
        }
    </style>
</head>

<body>

    <!-- Background Images -->
    <div class="bg-cycle">
        <div class="bg bg1"></div>
        <div class="bg bg2"></div>
        <div class="bg bg3"></div>
        <div class="bg bg4"></div>
    </div>

    <div class="overlay">

        <!-- Navbar -->
        <nav class="navbar navbar-dark asu-red">
            <div class="container justify-content-between align-items-center">

                <a href="index.html"
                   class="d-flex align-items-center text-decoration-none">

                    <img
                        src="static/logo.png"
                        alt="Patent Pending Logo"
                        style="height:50px; margin-right:10px;"
                    >

                    <span class="navbar-brand mb-0 h1">
                        <strong>Patent Pending #11285</strong>
                    </span>

                </a>

                <div class="d-flex nav-links gap-2">

                    <a href="index.html"
                       class="btn btn-home">
                        Home
                    </a>

                    <a href="roster.html"
                       class="btn btn-nav-outline">
                        Team
                    </a>

                    <a href="robots.html"
                       class="btn btn-nav-outline">
                        Our Robots
                    </a>

                    <a href="awards.html"
                       class="btn btn-nav-outline">
                        Award History
                    </a>

                    <a href="Schedule.html"
                       class="btn btn-nav-outline">
                        Schedule
                    </a>

                    <a href="contact.html"
                       class="btn btn-nav-outline">
                        Contact Us
                    </a>

                </div>
            </div>
        </nav>


        <!-- Contact Page -->
        <main class="container py-5">

            <div class="text-center mb-4">

                <h1 class="display-3 fw-bold outlined-title">
                    Contact Us
                </h1>

                <p class="lead fs-5">
                    Have a question or want to get in touch with MCHS Robotics?
                </p>

            </div>


            <div class="contact-card">

                <div class="text-center">

                    <h2 class="contact-title">
                        Send Us a Message
                    </h2>

                    <p class="contact-description">
                        Fill out the form below and we'll get back to you.
                    </p>

                </div>


                <!-- =========================
                     GOOGLE FORM
                     
                     REPLACE THE URL BELOW
                     WITH YOUR GOOGLE FORM
                     EMBED URL
                ========================= -->

                <div class="form-container">

                    <iframe
                        class="google-form"
                        src="https://forms.gle/ro3KXbGmjU488juo8"
                        title="MCHS Robotics Contact Form"
                        loading="lazy">
                    </iframe>

                </div>


                <!-- Email Option -->

                <div class="text-center mt-4">

                    <p class="mb-3">
                        Prefer to email us directly?
                    </p>

                    <a
                        href="mailto:mchsrobotics11285@gmail.com?subject=Contact%20MCHS%20Robotics"
                        class="btn email-button">

                        Email MCHS Robotics

                    </a>

                </div>

            </div>

        </main>


        <!-- Footer -->
        <footer class="asu-red text-white text-center p-3">

            © 2026 Patent Pending

        </footer>

    </div>

</body>
</html>
